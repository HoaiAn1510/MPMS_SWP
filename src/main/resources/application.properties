spring.application.name=manga-management
spring.config.import=optional:file:.env.properties

# Gemini
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-3.5-flash

# OpenAI - Image generation
openai.api.key=${OPENAI_API_KEY:}
openai.image.model=gpt-image-2

# Database
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/swp391?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Use exact column names from @Column(name=...) without snake_case conversion
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# OpenAPI / Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Mail — thật ra giá trị nạp từ .env.properties (không commit vào git, xem
# spring.config.import ở đầu file). Không hardcode tài khoản/mật khẩu thật ở đây.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# eSMS - SMS OTP/CSKH qua Brandname (SmsType=2).
app.sms.provider=${SMS_PROVIDER:esms}
app.sms.esms.endpoint=${ESMS_ENDPOINT:https://rest.esms.vn/MainService.svc/json/SendMultipleMessage_V4_post_json/}
app.sms.esms.api-key=${ESMS_API_KEY:}
app.sms.esms.secret-key=${ESMS_SECRET_KEY:}
app.sms.esms.brandname=${ESMS_BRANDNAME:}
app.sms.esms.sms-type=${ESMS_SMS_TYPE:2}
app.sms.esms.sandbox=${ESMS_SANDBOX:true}
app.sms.esms.template-ready=${ESMS_TEMPLATE_READY:false}
app.sms.esms.supported-carriers=${ESMS_SUPPORTED_CARRIERS:}
app.sms.otp-template=${SMS_OTP_TEMPLATE:{OTP} la ma xac minh cua ban}

# Runtime uploads must live outside the packaged classpath so they remain
# available after restart and when the application runs from a JAR.
app.upload.root=${APP_UPLOAD_ROOT:uploads}

# Spring Boot's default multipart limit is only 1MB/file, which silently
# breaks the connection (empty response -> "Unexpected end of JSON input" on
# the client) for any real user-created image (cover jacket, proposal PDF,
# chat attachment...). Raise it to a size that comfortably fits those files.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
